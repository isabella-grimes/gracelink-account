# G.R.A.C.E accounts platform: one stack serving every tenant (customer business).
# Each tenant is a separate site with its own database, on its own domain.
#
# Start:   ./scripts/install.sh       (first time)
# Manage:  ./scripts/new-tenant.sh, set-plan.sh, list-tenants.sh, backup.sh, update.sh
#
# Settings come from .env (copy .env.example).

x-app-image: &app_image
  image: ${GRACE_IMAGE:-grace-accounts}:${GRACE_TAG:-16}
  pull_policy: ${PULL_POLICY:-missing}
  restart: unless-stopped

x-app-service: &app_service
  <<: *app_image
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  # ---------------------------------------------------------------- edge
  traefik:
    image: traefik:v3.8
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.underscoreHeadersStrategy=delete
      - --entrypoints.https.address=:443
      - --entrypoints.https.http.underscoreHeadersStrategy=delete
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=http
      - --log.level=WARN
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - certificates:/certificates

  # ---------------------------------------------------------------- data
  db:
    image: mariadb:11.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-1G}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  # ---------------------------------------------------------------- app
  configurator:
    <<: *app_image
    restart: on-failure
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
        bench set-config -g chromium_path /usr/lib/chromium/chromium-headless-shell;
        bench set-config -g grace_support_url "${SUPPORT_URL:-}";
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  backend:
    <<: *app_service
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      FORWARDED_ALLOW_IPS: "*"

  frontend:
    <<: *app_image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: 8080
      FRAPPE_SITE_NAME_HEADER: $$host
      TRUST_UPSTREAM_FORWARDED_PROTO: "on"
      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - backend
      - websocket

  websocket:
    <<: *app_service
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  queue-short:
    <<: *app_service
    command: bench worker --queue short,default

  queue-long:
    <<: *app_service
    command: bench worker --queue long,default,short

  scheduler:
    <<: *app_service
    command: bench schedule

volumes:
  sites:
  logs:
  db-data:
  redis-queue-data:
  certificates:
