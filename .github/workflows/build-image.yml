# Builds the G.R.A.C.E accounts image on GitHub and publishes it to GitHub Container Registry,
# so servers only need to pull it. Runs when apps.json changes on this branch, weekly
# (to pick up ERPNext/ZATCA fixes), or manually from the Actions tab.
# Servers then use in .env:
#   GRACE_IMAGE=ghcr.io/<owner>/grace-accounts
#   PULL_POLICY=always
name: Build image

on:
  push:
    branches: [platform]
    paths: [apps.json, .github/workflows/build-image.yml]
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grace-accounts" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=apps.json
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:16
            ${{ steps.img.outputs.name }}:16-${{ github.run_number }}
